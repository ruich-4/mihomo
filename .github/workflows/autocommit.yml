name: Auto Update CIDR Lists
on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - "Ruleset/**" # Only trigger on changes to Ruleset directory

jobs:
  update-cidr-lists:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permission to commit and push to the repository

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for proper committing

      - name: Update CIDR lists
        run: |
          # Create Ruleset directory if it doesn't exist
          mkdir -p Ruleset

          # Keep the current lists until both downloads pass validation.
          cidr_tmp_dir=$(mktemp -d)
          trap 'rm -rf "$cidr_tmp_dir"' EXIT
          for name in private cn; do
            curl --fail --show-error --silent --location --retry 3 --max-time 60 \
              "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/$name.txt" \
              -o "$cidr_tmp_dir/$name.txt"
          done

          python3 - "$cidr_tmp_dir" <<'PYTHON'
          import ipaddress
          import sys
          from pathlib import Path

          directory = Path(sys.argv[1])
          for name in ("private", "cn"):
              entries = (directory / f"{name}.txt").read_text().splitlines()
              if not entries:
                  raise ValueError(f"{name}: empty CIDR list")
              rules = []
              for entry in entries:
                  ipaddress.ip_network(entry, strict=True)
                  rules.append(f"IP-CIDR,{entry},no-resolve\n")
              (directory / f"{name}.list").write_text("".join(rules))
          PYTHON

          for name in private cn; do
            mv "$cidr_tmp_dir/$name.list" "Ruleset/$name.list"
          done

          # Display updated content for verification
          echo "Updated cn.list content:"
          head -n 5 Ruleset/cn.list

      - name: Commit and push changes
        run: |
          # Check if there are changes to commit
          if [[ $(git status --porcelain) ]]; then
            # Configure Git
            git config --local user.email "113399748+ruich-4@users.noreply.github.com"
            git config --local user.name "ruich-4"
            
            # Define random commit messages
            MESSAGES=(
              "chore(bot): 😂 auto update CIDR lists"
              "chore(bot): 😱 auto update CIDR lists"
              "chore(bot): 👿 auto update CIDR lists"
              "chore(bot): 💩 auto update CIDR lists"
              "chore(bot): 🙏 auto update CIDR lists"
              "chore(bot): 🙈 auto update CIDR lists"
              "chore(bot): 🐐 auto update CIDR lists"
              "chore(bot): 🤖 auto update CIDR lists"
              "chore(bot): 🟩 auto update CIDR lists"
              "chore(bot): 👻 auto update CIDR lists"
            )
            
            # Select random message
            RANDOM_INDEX=$((RANDOM % ${#MESSAGES[@]}))
            COMMIT_MSG="${MESSAGES[$RANDOM_INDEX]}"
            
            # Add changes and commit
            git add Ruleset/private.list Ruleset/cn.list
            git commit -m "$COMMIT_MSG"
            
            # Push changes
            git push origin main
          else
            echo "No changes to commit"
          fi
